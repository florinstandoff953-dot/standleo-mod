name: Build Android .so
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: cirrusci/android-sdk:30
    steps:
      - uses: actions/checkout@v4

      - name: Compile with NDK Clang
        run: |
          NDK_TOOLCHAIN=$ANDROID_HOME/ndk-bundle/toolchains/llvm/prebuilt/linux-x86_64/bin
          
          $NDK_TOOLCHAIN/aarch64-linux-android30-clang++ \
            -shared -fPIC main.cpp \
            -o libstandleo_mod.so \
            -llog

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-so
          path: libstandleo_mod.so
