name: Build Android .so
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Android NDK
        run: |
          echo "Downloading Android NDK..."
          wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
          unzip -q android-ndk-r25b-linux.zip
          echo "NDK_PATH=$PWD/android-ndk-r25b" >> $GITHUB_ENV
      - name: Create CMakeLists.txt
        run: |
          cat << 'EOF' > CMakeLists.txt
          cmake_minimum_required(VERSION 3.10)
          project(standleo_mod)
          add_library(standleo_mod SHARED main.cpp)
          target_link_libraries(standleo_mod log)
          EOF
      - name: Build with CMake
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24
          cmake --build .
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-so
          path: build/libstandleo_mod.so
          
