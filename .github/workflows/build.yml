name: Build Android .so
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Android NDK
        run: |
          echo "Downloading Android NDK..."
          wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
          unzip -q android-ndk-r25b-linux.zip
          echo "NDK_PATH=$PWD/android-ndk-r25b" >> $GITHUB_ENV
      - name: Compile .so for arm64-v8a
        run: |
          $NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang++ -shared -fPIC main.cpp -o libstandleo_mod.so -llog
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-so
          path: libstandleo_mod.so
          
